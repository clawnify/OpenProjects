name = "open-projects"
main = "src/server/index.ts"
compatibility_date = "2026-04-15"
compatibility_flags = ["nodejs_compat"]

# Local development only. The deployed build DROPS this file and generates its
# own configuration from clawnify.json (database, file storage, routes).

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/llms.txt"]

[[d1_databases]]
binding = "DB"
database_name = "open-projects-db"
database_id = "local"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "open-projects-files"
